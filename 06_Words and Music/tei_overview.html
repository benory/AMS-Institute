<html>
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.16.1/vis.css" type="text/css" />
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.16.1/vis-network.min.js"> </script>
<center>
<h1></h1>
</center>

<style type="text/css">

        #mynetwork {
            width: 100%;
            height: 400px;
            background-color: white;
            border: 1px solid lightgray;
            position: relative;
            float: left;
        }

        

        

        
</style>

</head>

<body>
<div id = "mynetwork"></div>


<script type="text/javascript">

    // initialize global variables.
    var edges;
    var nodes;
    var network; 
    var container;
    var options, data;

    
    // This method is responsible for drawing the graph, returns the drawn network
    function drawGraph() {
        var container = document.getElementById('mynetwork');
        
        

        // parsing and collecting nodes and edges from the python
        nodes = new vis.DataSet([{"font": {"color": "black"}, "group": 0, "id": 0, "label": "teiHeader", "level": 0, "scaling": {"label": {"enabled": true}}, "shape": "dot", "size": 10, "value": 219}, {"font": {"color": "black"}, "group": 1, "id": 1, "label": "fileDesc", "level": 1, "scaling": {"label": {"enabled": true}}, "shape": "dot", "size": 10, "value": 52}, {"font": {"color": "black"}, "group": 1, "id": 54, "label": "encodingDesc", "level": 1, "scaling": {"label": {"enabled": true}}, "shape": "dot", "size": 10, "value": 119}, {"font": {"color": "black"}, "group": 1, "id": 174, "label": "profileDesc", "level": 1, "scaling": {"label": {"enabled": true}}, "shape": "dot", "size": 10, "value": 8}, {"font": {"color": "black"}, "group": 1, "id": 183, "label": "revisionDesc", "level": 1, "scaling": {"label": {"enabled": true}}, "shape": "dot", "size": 10, "value": 36}]);
        edges = new vis.DataSet([{"arrows": "to", "from": 0, "id": "0_teiHeader|1_fileDesc", "to": 1, "weight": 1}, {"arrows": "to", "from": 0, "id": "0_teiHeader|54_encodingDesc", "to": 54, "weight": 1}, {"arrows": "to", "from": 0, "id": "0_teiHeader|174_profileDesc", "to": 174, "weight": 1}, {"arrows": "to", "from": 0, "id": "0_teiHeader|183_revisionDesc", "to": 183, "weight": 1}]);

        // adding nodes and edges to the graph
        data = {nodes: nodes, edges: edges};

        var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": false,
            "type": "continuous"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};
        
        

        

        network = new vis.Network(container, data, options);
	 
        


        

        return network;

    }

    drawGraph();

</script>
</body>
</html>
